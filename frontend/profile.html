<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><link rel="stylesheet" href="css/style.css"></head><body><nav><a class="brand" href="dashboard.html">📍 Find My Friend</a></nav><main class="container"><div class="panel"><h1>Profile</h1><form id="profile"><label>Name<input id="name" required></label><label>Email<input id="email" disabled></label><label>Bio<textarea id="bio"></textarea></label><button class="btn">Save Profile</button><p id="msg" class="msg"></p></form>
