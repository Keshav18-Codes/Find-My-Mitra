<!doctype html>
<html>
    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Dashboard</title><link rel="stylesheet" href="css/style.css"></head>
    <body>
        <nav>
            <a class="brand" href="dashboard.html">
                <i class="pin"></i>Find My Mitra</a>
            <span>
                <a href="map.html">Map</a>
                <a href="friends.html">Friends</a>
                <a href="notifications.html">Notifications</a>
                <a href="profile.html">Profile</a>
                <button id="logout" class="linkbtn">Logout</button></span></nav>
        <main class="container">
            <h1 id="welcome">Dashboard</h1>
            <div class="grid">
                <div class="card">
                    <h3>Location Sharing</h3>
                    <p id="sharing">Loading…</p>
                    <button id="toggle" class="btn">Enable Location Sharing</button>
                </div>
                <div class="card">
                    <h3>Friends</h3>
                    <p id="friendCount">Loading…</p>
                    <a class="btn ghost" href="friends.html">Manage Friends</a>
                </div>
                <div class="card danger">
                    <h3>Emergency</h3>
                    <p>Send your current location to your approved friends.</p>
                    <a class="btn" href="sos.html">Open SOS</a>
                </div>
                <div class="card">
                    <h3>Live Map</h3>
                    <p>See friends who are actively sharing their location.</p>
                    <a class="btn ghost" href="map.html">Open Map</a>
                </div>
            </div>
        </main>
        <script src="js/ui.js"></script><script src="js/dashboard.js"></script>
    </body>
</html>
