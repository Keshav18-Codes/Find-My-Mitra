<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Find My Friend</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="brand">
                <i class="pin"></i>Find My Friend
            </div>

            <h1>Create account</h1>

            <form id="registerForm">

                <!-- Name -->
                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <!-- Email -->
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >


                <!-- Confirm Password -->
                <label for="confirm">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm"
                    name="confirm"
                    placeholder="Confirm password"
                    required
                >


                <!-- Register button -->
                <button type="submit">
                    Register
                </button>


                <!-- Message -->
                <p id="msg"></p>

            </form>


            <p>
                Already registered?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
